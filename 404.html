<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Страница не найдена — Лунара</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231f1a24'/%3E%3Cpath d='M16 8a6 6 0 0 0 8 8 8 8 0 1 1-8-8z' fill='none' stroke='%23c9a66b' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
:root{--bg:#f2f0f4; --ink:#1f1a24; --muted:#766e7d; --accent:#5a2a4a; --gold:#a8834b; --moon:rgba(168,131,75,.30)}
@media (prefers-color-scheme:dark){:root{--bg:#141118; --ink:#efe9f1; --muted:#9d94a4; --accent:#e3b37a; --gold:#d6b47f; --moon:rgba(214,180,127,.34)}}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink);
  background:radial-gradient(1100px 520px at 100% -8%, rgba(168,131,75,.08), transparent 62%), var(--bg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{text-align:center; max-width:420px}
.moon{width:120px; height:120px; margin:0 auto 28px; border-radius:50%; box-shadow:inset -20px 9px 0 0 var(--moon)}
.rule{display:block; width:56px; height:1px; background:var(--gold); margin:0 auto 18px}
h1{font:400 40px/1.1 "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; margin:0 0 12px}
p{color:var(--muted); margin:0 0 26px}
a{display:inline-block; padding:11px 20px; border-radius:8px; background:var(--accent); color:var(--bg); text-decoration:none; font-weight:600}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true"></div>
  <span class="rule" aria-hidden="true"></span>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела. Запись и расписание — на главной.</p>
  <a href="/lunara/">Перейти к записи</a>
</main>
</body>
</html>
